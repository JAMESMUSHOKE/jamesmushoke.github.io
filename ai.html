<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>SHALOM AI - Your Web3 Shopping Assistant</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>🤖 SHALOM AI ASSISTANT</h1>
  <p>Ask me anything. I use AI to find products, compare prices, and give you the best deals in Pi.</p>
  
  <div id="chatbox">
    <input type="text" id="userInput" placeholder="Ask SHALOM AI...">
    <button onclick="askAI()">Send</button>
  </div>

  <script>
    function askAI() {
      let question = document.getElementById('userInput').value;
      alert("SHALOM AI: Processing your request with Web3 intelligence... Coming Soon: " + question);
    }
  </script>
</body>
</html>
