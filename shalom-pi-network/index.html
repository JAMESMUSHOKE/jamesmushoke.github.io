<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shalom Pi Network - Step 10 Test</title>
  <script src="https://sdk.minepi.com/pi-sdk.js"></script>
</head>
<body style="text-align: center; font-family: Arial; padding-top: 50px; background: #f5f5f5;">
  
  <h1>Shalom Pi Network</h1>
  <p>Click the button below to complete Step 10 Test Payment</p>
  
  <button id="payButton" style="padding: 20px 40px; font-size: 20px; background: #ffc107; color: #000; border: none; border-radius: 10px; cursor: pointer; font-weight: bold;">
    PAY 0.01 TEST PI
  </button>

  <script>
    // IMPORTANT: sandbox must be FALSE for Step 10 to work
    Pi.init({ version: "2.0", sandbox: false });

    // Check for incomplete payments first
    Pi.authenticate(['payments', 'username'], onIncompletePaymentFound);

    document.getElementById("payButton").onclick = function() {
      const paymentData = {
        amount: 0.01,
        memo: "Step 10 Test Payment - Shalom App",
        metadata: { "app_name": "shalom-pi-network" }
      };

      const callbacks = {
        onReadyForServerApproval: function(paymentId) {
          // Wallet opens here
          console.log("Payment Approved: " + paymentId);
          alert("Wallet Opened! Please confirm payment.");
        },
        onReadyForServerCompletion: function(paymentId, txid) {
          // Payment completed
          alert("Payment Successful! Transaction ID: " + txid);
        },
        onCancel: function(paymentId) {
          alert("Payment Cancelled");
        },
        onError: function(error) {
          alert("Error: " + error);
        }
      };
      
      Pi.createPayment(paymentData, callbacks);
    };

    function onIncompletePaymentFound(payment) {
      // This prevents the app from freezing if there was a pending payment
      console.log("Found incomplete payment: ", payment);
    }
  </script>

</body>
</html>
