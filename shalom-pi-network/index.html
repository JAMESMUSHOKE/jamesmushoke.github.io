<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SHALOM - Welcome</title>
  <script src="https://sdk.minepi.com/pi-sdk.js"></script>
  <style>
    body {font-family:Arial;background:#3a0ca3;color:#fff;text-align:center;padding:0;margin:0}
    .banner{width:100%;max-height:200px;object-fit:cover}
    .logo{width:100px;height:100px;border-radius:50%;margin-top:-50px;border:4px solid #fff}
    .card{background:#fff;color:#000;padding:20px;border-radius:15px;max-width:400px;margin:20px auto;box-shadow:0 5px 20px rgba(0,0,0,0.3)}
    .btn{padding:15px;background:#f39c12;color:#000;border:none;border-radius:10px;font-weight:bold;font-size:16px;width:100%;margin:10px 0;cursor:pointer}
    .service{padding:12px;background:#f1f1f1;border-radius:8px;margin:8px 0;text-align:left;border-left:4px solid #7209b7}
    .coming{background:#d4edda;color:#155724;padding:10px;border-radius:8px;font-size:14px;font-weight:bold}
  </style>
</head>
<body>
  <!-- YOUR BANNER -->
  <img src="banner.jpg" alt="SHALOM Banner" class="banner">

  <!-- YOUR LOGO -->
  <img src="logo.png" alt="SHALOM Logo" class="logo">

  <div class="card">
    <h3 id="welcome">Welcome to SHALOM</h3>
    <p>Your new way to pay with Pi</p>
    <button class="btn" id="login">Sign In with Pi Username</button>
  </div>

  <div class="card" id="services" style="display:none">
    <h3>Services We Are Preparing</h3>
    <div class="service">📱 Airtime for All Networks</div>
    <div class="service">🌐 Internet Data Bundles</div>
    <div class="service">💡 Electricity & Water Bills</div>
    <div class="service">📺 TV Subscriptions - DSTV, Azam</div>
    
    <br>
    <div class="coming">
      ⏳ All services will be activated after Pi Mainnet <br>
      For now you can browse and follow our updates
    </div>
  </div>

<script>
Pi.init({version:"2.0", sandbox:false}); // Ecosystem version - NO payments

document.getElementById("login").onclick = async () => {
  try{
    const auth = await Pi.authenticate(['username']); // Username ONLY
    document.getElementById("welcome").innerText = "Welcome, " + auth.user.username;
    document.getElementById("login").innerText = "Signed In ✓";
    document.getElementById("login").style.background = "#28a745";
    document.getElementById("login").disabled = true;
    document.getElementById("services").style.display = "block";
  }catch(e){
    alert("Please open this app inside Pi Browser first");
  }
}
</script>
</body>
</html>
