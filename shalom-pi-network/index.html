<!DOCTYPE html>
<html>
<head>
  <title>SHALOM</title>
  <script src="https://sdk.minepi.com/pi-sdk.js"></script>
  <style>
    body { font-family: Arial; text-align: center; padding: 20px; background: #f5f5f5; }
    #loader { font-size: 18px; color: #6f42c1; }
    #main-content { display: none; }
    button { padding: 12px 24px; margin: 10px; border: none; border-radius: 8px; background: #6f42c1; color: white; font-size: 16px; cursor: pointer; }
    button:disabled { background: gray; }
  </style>
</head>
<body>

<div id="loader">Loading SHALOM...</div>

<div id="main-content">
  <h1>Welcome to SHALOM</h1>
  <p>Web3 Payments for the World 🌍</p>
  <button id="pi-login">Authenticate with Pi</button>
  <button id="buy-btn" onclick="buyProduct('Shalom Product', 1)">Pay with Pi</button>
</div>

<script>
let currentUser = null;
Pi.init({ version: "2.0", sandbox: true });

window.addEventListener('load', async () => {
  setTimeout(async () => {
    try {
      const authResult = await Pi.authenticate(['username', 'payments'], onIncompletePaymentFound);
      currentUser = authResult.user;
      
      document.getElementById("loader").style.display = "none";
      document.getElementById("main-content").style.display = "block";
      document.getElementById("pi-login").innerText = `Hi, ${currentUser.username}`;
      document.getElementById("pi-login").disabled = true;
      
    } catch (err) { 
      document.getElementById("loader").innerText = "Please login with Pi Browser";
      console.error(err); 
    }
  }, 1500);
});

function onIncompletePaymentFound(payment) { 
  console.log(payment); 
}

async function buyProduct(productName, amount) {
  if(!currentUser) return alert("Please wait, logging in...");
  alert("Processing Payment with Pi...");
  setTimeout(() => { 
    alert(`Payment Success! \nProduct: ${productName}\nTX: SIM-TX-${Date.now()}`); 
  }, 2000);
}
</script>

</body>
</html>
