  <style>
    :root { --purple:#4c1d95; --gold:#f59e0b; --dark:#1a0033; --green:#10b981; }
    *{margin:0;padding:0;box-sizing:border-box}
    body {font-family:'Roboto',Arial;background:linear-gradient(135deg, var(--purple) 0%, var(--dark) 100%);color:#fff;text-align:center;padding:0;margin:0;padding-bottom:90px;min-height:100vh}
.topbar{display:flex;justify-content:space-between;align-items:center;padding:12px 15px}
.lang-select{padding:8px;background:rgba(255,255,255,0.1);color:#fff;border-radius:8px;border:1px solid var(--gold);font-weight:bold}
.logo{width:90px;height:90px;border-radius:50%;border:4px solid var(--gold);background:#fff;margin:-45px auto 10px;box-shadow:0 0 20px var(--gold)}
.hero-banner{width:100%;height:180px;object-fit:cover;border-bottom:3px solid var(--gold)}
.card{background:rgba(255,255,255,0.95);color:#000;padding:25px;border-radius:20px;max-width:450px;margin:15px auto;box-shadow:0 10px 30px rgba(0,0,0,0.4);border:2px solid var(--gold)}
.card h2{font-family:'Orbitron',sans-serif;color:var(--purple);margin-bottom:8px}
.btn{padding:18px;background:linear-gradient(90deg, var(--gold), #ffcc00);color:#000;border:none;border-radius:15px;font-weight:900;font-size:17px;width:95%;margin:12px auto;cursor:pointer;box-shadow:0 4px 15px rgba(245,158,11,0.4)}
.btn:disabled{background:#ccc;box-shadow:none}
.testnet-badge{background:linear-gradient(90deg, var(--green), #059669);color:#fff;padding:12px;border-radius:10px;font-size:13px;font-weight:bold;margin:15px 0}
.protocol-badge{background:linear-gradient(90deg, #10b981, #059669);color:#fff;padding:12px;border-radius:10px;font-size:14px;font-weight:bold;margin:15px 0}
.navbar{position:fixed;bottom:0;left:0;width:100%;background:rgba(26,0,51,0.95);backdrop-filter:blur(10px);display:flex;justify-content:space-around;padding:10px 0;border-top:2px solid var(--gold)}
.nav-item{color:#ccc;text-align:center;font-size:11px;cursor:pointer;padding:5px}.nav-item.active{color:var(--gold);font-weight:bold;transform:scale(1.1)}
.nav-icon{font-size:24px;display:block}
.page{display:none}.page.active{display:block}
.products-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;padding:12px;max-width:500px;margin:0 auto}
.product-card{background:#fff;color:#000;border-radius:15px;padding:10px;text-align:left;box-shadow:0 4px 10px rgba(0,0,0,0.2)}
.product-card img{width:100%;height:120px;object-fit:cover;border-radius:10px}
.product-card h4{font-size:13px;margin:6px 0;min-height:32px}
.product-price{color:var(--purple);font-weight:900;font-size:18px}
.btn-pay{background:linear-gradient(90deg, var(--gold), #ffcc00);color:#000}
.btn-cart{background:#fff;color:var(--purple);border:2px solid var(--purple);margin-top:5px}
.product-btn{padding:10px;width:100%;font-size:14px;border-radius:10px;font-weight:bold}
 #ai-btn{position:fixed;bottom:100px;right:15px;background:linear-gradient(135deg, var(--gold), #ffcc00);border:none;border-radius:50%;width:60px;height:60px;font-size:28px;cursor:pointer;z-index:999;box-shadow:0 4px 20px rgba(245,158,11,0.6)}
 #ai-chatbox{display:none;position:fixed;bottom:170px;right:15px;width:340px;height:450px;background:#fff;border:3px solid var(--gold);border-radius:20px;flex-direction:column;color:#000;z-index:999;box-shadow:0 10px 40px rgba(0,0,0,0.5)}
 #ai-header{background:linear-gradient(90deg, var(--gold), #ffcc00);color:#000;padding:14px;font-weight:900;font-family:'Orbitron'}
 #ai-messages{flex:1;overflow-y:auto;padding:12px;text-align:left;font-size:14px}
.msg-user{background:var(--gold);color:#000;padding:10px;border-radius:15px 15px 0 15px;margin:6px 0 6px auto;max-width:80%;text-align:right}
.msg-ai{background:#f1f1f1;padding:10px;border-radius:15px 15px 15px 0;margin:6px auto 6px 0;max-width:80%}
 #ai-input-area{display:flex;padding:10px;border-top:1px solid #ddd}
 #ai-input{flex:1;border:2px solid var(--gold);border-radius:10px;padding:10px;color:#000}
 #ai-send{background:var(--purple);color:#fff;border:none;border-radius:10px;padding:10px 15px;margin-left:5px;cursor:pointer;font-weight:bold}

function loadProducts(){
  const lang = document.getElementById("lang").value; const t = translations[lang];
  let html = ""; products.forEach(p=>{ html += `<div class="product-card"><img src="${p.img}"><h4>${p.name}</h4><p class="product-price">π ${p.price}</p><button class="btn product-btn btn-pay" onclick="payWithPi(${p.price}, '${p.name}')">${t.payBtn}</button><button class="btn product-btn btn-cart" onclick="addToCart('${p.name}', ${p.price})">🛒 Add to Cart</button></div>`; });
  document.getElementById("productsGrid").innerHTML = html;
}

function changeLang(){ const lang = document.getElementById("lang").value; const t = translations[lang]; for(let key in t){ if(document.getElementById(key)) document.getElementById(key).innerText = t[key]; } document.getElementById("ai-input").placeholder = t.aiPlaceholder; loadProducts(); }

document.querySelectorAll('.nav-item').forEach(item => { item.addEventListener('click', function() { const pageId = this.getAttribute('data-page'); document.querySelectorAll('.page').forEach(p => p.classList.remove('active')); document.getElementById(pageId).classList.add('active'); document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active')); this.classList.add('active'); if(pageId === 'marketPage') loadProducts(); }); });

// AI CODE
const aiBrain = { en: {"what is shalom": "SHALOM is the first Global Super App built on Pi Network.", "default": "Thank you for your question."}, sw: {"shalom ni nini": "SHALOM ni Super App ya kwanza kujengwa juu ya Pi Network.", "default": "Asante kwa swali lako."} };
function getAIAnswer(q, lang){ q = q.toLowerCase(); const brain = aiBrain[lang] || aiBrain['en']; for(let key in brain){ if(q.includes(key)) return brain[key]; } return brain['default']; }
document.getElementById('ai-btn').onclick = () => { const box = document.getElementById('ai-chatbox'); box.style.display = box.style.display === 'flex'? 'none' : 'flex'; }
document.getElementById('ai-send').onclick = () => { const msg = document.getElementById('ai-input').value.trim(); if(!msg) return; const lang = document.getElementById("lang").value; document.getElementById('ai-messages').innerHTML += `<div class="msg-user">${msg}</div>`; setTimeout(() => { document.getElementById('ai-messages').innerHTML += `<div class="msg-ai">${getAIAnswer(msg, lang)}</div>`; }, 600); document.getElementById('ai-input').value = ''; }

Pi.init({version:"2.0", sandbox:true});
document.getElementById("loginBtn").onclick = async () => { const lang = document.getElementById("lang").value; document.getElementById("status").innerText = "Connecting..."; try{ const auth = await Pi.authenticate(['username', 'payments']); document.getElementById("status").innerText = translations[lang].connected; document.getElementById("loginBtn").innerText = translations[lang].connected; document.getElementById("loginBtn").disabled = true; document.getElementById("profileUser").innerText = "Status: " + auth.user.username; }catch(e){ alert("Please open this app inside Pi Browser"); } }

async function payWithPi(amount, productName) {
  const lang = document.getElementById("lang").value; const t = translations[lang];
  const fee = 0.01; const total = (amount + fee).toFixed(3);
  const confirm = window.confirm(`Confirm Payment\nProduct: ${productName}\nAmount: π ${amount}\nFee: π ${fee}\nTotal: π ${total}\n\n${t.testAlert}`);
  if(!confirm) return;
  try{
    Pi.createPayment({amount: amount, memo: "TESTNET: "+productName, metadata: { product: productName }}, {
      onReadyForServerApproval: (paymentId) => {
        // HII NDIO SIRI: TUNAJITHIBITISHA MOJA KWA MOJA BILA SERVER
        Pi.approvePayment(paymentId);
      },
      onReadyForServerCompletion: (paymentId, txid) => {
        alert("✅ Payment Complete! Thank you for testing SHALOM");
      },
      onCancel: () => alert("Cancelled"),
      onError: (error) => alert("Error: " + error)
    });
  }catch(e){ alert("Open in Pi Browser"); }
}
