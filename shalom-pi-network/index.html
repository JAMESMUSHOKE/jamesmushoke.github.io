<style>
:root{--purple:#4c1d95;--gold:#f59e0b;--dark:#1a0033;--green:#10b981}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Roboto',Arial;background:linear-gradient(135deg,var(--purple) 0%,var(--dark) 100%);color:#fff;text-align:center;padding-bottom:90px;min-height:100vh}
.topbar{display:flex;justify-content:space-between;align-items:center;padding:12px 15px}
.lang-select{padding:8px;background:rgba(255,255,255,0.1);color:#fff;border-radius:8px;border:1px solid var(--gold);font-weight:bold}
.logo{width:90px;height:90px;border-radius:50%;border:4px solid var(--gold);background:#fff;margin:-45px auto 10px;box-shadow:0 0 20px var(--gold)}
.hero-banner{width:100%;height:180px;object-fit:cover;border-bottom:3px solid var(--gold)}
.card{background:rgba(255,255,255,0.95);color:#000;padding:25px;border-radius:20px;max-width:450px;margin:15px auto;border:2px solid var(--gold)}
.card h2{font-family:'Orbitron',sans-serif;color:var(--purple)}
.btn{padding:18px;background:linear-gradient(90deg,var(--gold),#ffcc00);color:#000;border:none;border-radius:15px;font-weight:900;width:95%;margin:12px auto;cursor:pointer}
.testnet-badge,.protocol-badge{color:#fff;padding:12px;border-radius:10px;font-weight:bold;margin:15px 0}
.testnet-badge{background:linear-gradient(90deg,var(--green),#059669)}
.protocol-badge{background:linear-gradient(90deg,#10b981,#059669)}
.navbar{position:fixed;bottom:0;left:0;width:100%;background:rgba(26,0,51,0.95);display:flex;justify-content:space-around;padding:10px 0;border-top:2px solid var(--gold)}
.nav-item{color:#ccc;text-align:center;font-size:11px;cursor:pointer}.nav-item.active{color:var(--gold);font-weight:bold}
.page{display:none}.page.active{display:block}
.products-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;padding:12px;max-width:500px;margin:0 auto}
.product-card{background:#fff;color:#000;border-radius:15px;padding:10px;text-align:left}
.product-card img{width:100%;height:120px;object-fit:cover;border-radius:10px}
.product-price{color:var(--purple);font-weight:900;font-size:18px}
.product-btn{padding:10px;width:100%;font-size:14px;border-radius:10px;font-weight:bold;margin-top:5px}
#ai-btn{position:fixed;bottom:100px;right:15px;background:var(--gold);border:none;border-radius:50%;width:60px;height:60px;font-size:28px;cursor:pointer;z-index:999}
#ai-chatbox{display:none;position:fixed;bottom:170px;right:15px;width:340px;height:450px;background:#fff;border:3px solid var(--gold);border-radius:20px;flex-direction:column;color:#000;z-index:999}
</style>

function loadProducts(){const lang=document.getElementById("lang").value;const t=translations[lang];let html="";products.forEach((p,i)=>{html+=`<div class="product-card"><img src="${p.img}"><h4>${p.name}</h4><p class="product-price">π ${p.price}</p><button class="btn product-btn" onclick="payWithPi(${p.price},${i})">${t.payBtn}</button><button class="btn product-btn" style="background:#fff;color:var(--purple);border:2px solid var(--purple)" onclick="addToCart(${i})">🛒 Cart</button></div>`});document.getElementById("productsGrid").innerHTML=html}
function changeLang(){const lang=document.getElementById("lang").value;const t=translations[lang];for(let k in t){if(document.getElementById(k))document.getElementById(k).innerText=t[k]}loadProducts()}
document.querySelectorAll('.nav-item').forEach(i=>{i.addEventListener('click',function(){const p=this.dataset.page;document.querySelectorAll('.page').forEach(x=>x.classList.remove('active'));document.getElementById(p).classList.add('active');document.querySelectorAll('.nav-item').forEach(x=>x.classList.remove('active'));this.classList.add('active');if(p=='marketPage')loadProducts()})})
function comingSoon(){alert('Coming on Mainnet')}

Pi.init({version:"2.0",sandbox:true});
document.getElementById("loginBtn").onclick=async()=>{const lang=document.getElementById("lang").value;try{const auth=await Pi.authenticate(['username','payments']);document.getElementById("status").innerText=translations[lang].connected;document.getElementById("loginBtn").disabled=true;document.getElementById("profileUser").innerText="Status: "+auth.user.username}catch(e){alert("Open in Pi Browser")}}

async function payWithPi(amount,index){const lang=document.getElementById("lang").value;const t=translations[lang];const p=products[index];if(!confirm(`Pay ${p.name}\nAmount: π ${amount}\n\n${t.testAlert}`))return;Pi.createPayment({amount:amount,memo:"TEST:"+p.name},{
onReadyForServerApproval:(id)=>Pi.approvePayment(id),
onReadyForServerCompletion:(id,tx)=>alert("✅ Payment Complete!"),
onCancel:()=>alert("Cancelled"),
onError:(e)=>alert("Error: "+e)
})}

let cart=[];function addToCart(i){cart.push(products[i]);alert(`Added to cart. Total: ${cart.length}`)}
document.getElementById("logoutBtn").onclick=()=>location.reload();
document.getElementById('ai-btn').onclick=()=>{const b=document.getElementById('ai-chatbox');b.style.display=b.style.display=='flex'?'none':'flex'}
