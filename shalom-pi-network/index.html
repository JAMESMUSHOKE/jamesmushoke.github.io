<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SHALOM - Buy Airtime & Bundles</title>
  <script src="https://sdk.minepi.com/pi-sdk.js"></script>
  <style>
    body {font-family:Arial;text-align:center;background:#7209b7;color:#fff;padding:20px}
    .card{background:#fff;color:#000;padding:20px;border-radius:15px;max-width:400px;margin:20px auto}
    button{padding:15px 30px;background:#f39c12;border:none;border-radius:10px;font-weight:bold;font-size:16px;width:90%;margin:10px;cursor:pointer}
  </style>
</head>
<body>
  <h1>Welcome to SHALOM</h1>
  <p>Buy Airtime & Data with Pi</p>
  
  <div class="card">
    <p>Logged in as: <b id="user">Guest</b></p>
    <button id="login">Login with Pi</button>
    <button id="buy" disabled>Buy 1 Pi Airtime</button>
    <p id="status"></p>
  </div>

<script>
Pi.init({version:"2.0",sandbox:false}); // IMPORTANT: sandbox:false kwa Ecosystem

let currentUser = null;

document.getElementById("login").onclick = async () => {
  const auth = await Pi.authenticate(['username','payments']);
  currentUser = auth.user;
  document.getElementById("user").innerText = auth.user.username;
  document.getElementById("login").innerText = "Logged In ✓";
  document.getElementById("buy").disabled = false;
  document.getElementById("status").innerText = "You can now buy";
}

document.getElementById("buy").onclick = () => {
  Pi.createPayment({
    amount: 1, 
    memo: "SHALOM Airtime Purchase",
    metadata: {product: "airtime"}
  },{
    onReadyForServerApproval: (id) => Pi.approvePayment(id),
    onReadyForServerCompletion: (id,tx) => {
      Pi.completePayment(id,tx);
      alert("Payment Success! TX: "+tx);
      document.getElementById("status").innerText = "Success! TX: "+tx;
    },
    onError: (e) => alert("Error: "+e)
  });
}
</script>
</body>
</html>
