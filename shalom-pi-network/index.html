<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>SHALOM - Global Pi Marketplace</title>

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;900&family=Roboto:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--p:#4c1d95;--g:#f59e0b;--d:#1a0033;--gr:#10b981}*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Roboto';background:linear-gradient(135deg,var(--p) 0%,var(--d) 100%);color:#fff;text-align:center;padding-bottom:90px}
.top{display:flex;justify-content:space-between;padding:12px}
.lang{padding:8px;background:rgba(255,255,255,0.1);color:#fff;border-radius:8px;border:1px solid var(--g)}
.logo{width:90px;height:90px;border-radius:50%;border:4px solid var(--g);background:#fff;margin:-45px auto 10px}
.card{background:rgba(255,255,255,0.95);color:#000;padding:20px;border-radius:20px;max-width:450px;margin:15px auto;border:2px solid var(--g)}
.btn{padding:16px;background:linear-gradient(90deg,var(--g),#ffcc00);color:#000;border:none;border-radius:15px;font-weight:900;width:95%;margin:10px auto;cursor:pointer}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;padding:12px;max-width:500px;margin:0 auto}
.prod{background:#fff;color:#000;border-radius:15px;padding:10px;text-align:left}
.prod img{width:100%;height:120px;object-fit:cover;border-radius:10px}
.page{display:none}.active{display:block}
.nav{position:fixed;bottom:0;left:0;width:100%;background:rgba(26,0,51,0.95);display:flex;justify-content:space-around;padding:10px;border-top:2px solid var(--g)}
.item{color:#ccc;text-align:center;font-size:11px;cursor:pointer}.item.act{color:var(--g);font-weight:bold}
#ai{position:fixed;bottom:100px;right:15px;background:var(--g);border:none;border-radius:50%;width:60px;height:60px;font-size:28px;cursor:pointer;z-index:999}
#box{display:none;position:fixed;bottom:170px;right:15px;width:340px;height:400px;background:#fff;border:3px solid var(--g);border-radius:20px;flex-direction:column;color:#000;z-index:999}

<div class="top"><div style="font-family:Orbitron;color:var(--g)">SHALOM</div>
<select class="lang" id="lang" onchange="changeLang()">

<option value="zh">中文</option><option value="es">ES</option><option value="ar">AR</option>
<option value="pt">PT</option><option value="ru">RU</option><option value="de">DE</option>
<option value="hi">HI</option><option value="jp">JP</option><option value="ko">KO</option>
</select></div>

<img src="https://via.placeholder.com/1200x300/4c1d95/f59e0b?text=SHALOM+MARKETPLACE" class="logo">

<div id="h" class="page active"><div class="card">
<div style="background:var(--gr);color:#fff;padding:10px;border-radius:10px;margin-bottom:10px" id="t1"></div>
<div style="background:var(--gr);color:#fff;padding:10px;border-radius:10px;margin-bottom:10px" id="t2"></div>
<h2 id="w"></h2><p id="s"></p><button class="btn" id="login"></button><p id="st" style="color:green"></p>
</div></div>

<div id="m" class="page"><div class="card"><h2 id="mt"></h2><p id="md"></p></div><div class="grid" id="prods"></div></div>
<div id="j" class="page"><div class="card"><h2 id="jt"></h2><p id="jd"></p><button class="btn" onclick="alert('Coming')">Explore</button></div></div>
<div id="b" class="page"><div class="card"><h2 id="bt"></h2><p id="bd"></p><button class="btn" onclick="alert('Coming')">Book</button></div></div>
<div id="pr" class="page"><div class="card"><h2 id="pt"></h2><p id="pu"></p><p id="pp"></p><button class="btn" id="out" style="background:#dc3545;color:#fff"></button></div></div>

<button id="ai">🤖</button><div id="box"><div style="background:var(--g);padding:12px;font-weight:900" id="at"></div>
<div id="amsg" style="flex:1;overflow-y:auto;padding:12px;text-align:left"></div>
<div style="display:flex;padding:10px"><input id="ain" style="flex:1;border:2px solid var(--g);border-radius:10px;padding:10px"><button id="asend" style="background:var(--p);color:#fff;border:none;border-radius:10px;padding:10px">Send</button></div></div>

<div class="nav">
<div class="item act" data-p="h"><span>🏠</span><span id="n1"></span></div>
<div class="item" data-p="m"><span>🛒</span><span id="n2"></span></div>
<div class="item" data-p="j"><span>🏗️</span><span id="n3"></span></div>
<div class="item" data-p="b"><span>📅</span><span id="n4"></span></div>
<div class="item" data-p="pr"><span>👤</span><span id="n5"></span></div>
</div>

hi:{t1:"⚠️ TESTNET",t2:"🚀 प्रोटोकॉल 28",w:"भविष्य",s:"60M+.",login:"Pi कनेक्ट",con:"कनेक्टेड",mt:"🛒 बाजार",md:"Pi भुगतान।",jt:"🏗️ निर्माण",jd:"सामग्री।",bt:"📅 सेवाएं",bd:"बुक करें।",pt:"👤 प्रोफ़ाइल",pu:"अतिथि",pp:"Pi:--",out:"डिस्कनेक्ट",n1:"होम",n2:"बाजार",n3:"निर्माण",n4:"बुकिंग",n5:"प्रोफ़ाइल",at:"AI",aw:"नमस्ते!",pay:"Pi भुगतान",test:"TESTNET"},
jp:{t1:"⚠️ テスト",t2:"🚀 プロトコル28",w:"未来",s:"6000万。",login:"Pi接続",con:"接続済",mt:"🛒 市場",md:"Pi支払い。",jt:"🏗️ 建設",jd:"資材。",bt:"📅 サービス",bd:"予約。",pt:"👤 プロフ",pu:"ゲスト",pp:"Pi:--",out:"切断",n1:"ホーム",n2:"市場",n3:"建設",n4:"予約",n5:"プロフ",at:"AI",aw:"こんにちは!",pay:"Pi支払",test:"テスト"},
ko:{t1:"⚠️ 테스트",t2:"🚀 프로토콜28",w:"미래",s:"6000만.",login:"Pi 연결",con:"연결됨",mt:"🛒 마켓",md:"Pi 결제.",jt:"🏗️ 건설",jd:"자재.",bt:"📅 서비스",bd:"예약.",pt:"👤 프로필",pu:"게스트",pp:"Pi:--",out:"해제",n1:"홈",n2:"마켓",n3:"건설",n4:"예약",n5:"프로필",at:"AI",aw:"안녕!",pay:"Pi 결제",test:"테스트"}};

const P=[{n:"VILLA DUBAI",p:5,i:"https://via.placeholder.com/400x300/4c1d95/f59e0b?text=VILLA"},
{n:"BUGATTI",p:10,i:"https://via.placeholder.com/400x300/4c1d95/f59e0b?text=BUGATTI"},
{n:"TESLA",p:0.2,i:"https://via.placeholder.com/400x300/4c1d95/f59e0b?text=TESLA"},
{n:"IPHONE 17",p:0.005,i:"https://via.placeholder.com/400x300/4c1d95/f59e0b?text=IPHONE"},
{n:"ROLEX",p:0.1,i:"https://via.placeholder.com/400x300/4c1d95/f59e0b?text=ROLEX"},
{n:"MALDIVES",p:50,i:"https://via.placeholder.com/400x300/4c1d95/f59e0b?text=ISLAND"},
{n:"GOLD 1KG",p:0.8,i:"https://via.placeholder.com/400x300/f59e0b/4c1d95?text=GOLD"},
{n:"JET",p:0.5,i:"https://via.placeholder.com/400x300/4c1d95/f59e0b?text=JET"},
{n:"BURJ",p:0.01,i:"https://via.placeholder.com/400x300/4c1d95/f59e0b?text=HOTEL"},
{n:"RANCH",p:10,i:"https://via.placeholder.com/400x300/4c1d95/f59e0b?text=RANCH"},
{n:"HARVARD",p:0.2,i:"https://via.placeholder.com/400x300/4c1d95/f59e0b?text=HARVARD"},
{n:"HEALTH",p:0.5,i:"https://via.placeholder.com/400x300/4c1d95/f59e0b?text=HEALTH"}];

function loadP(){const l=document.getElementById("lang").value;const t=T[l];let h="";P.forEach((x,i)=>{h+=`<div class="prod"><img src="${x.i}"><h4>${x.n}</h4><p style="color:var(--p);font-weight:900">π ${x.p}</p><button class="btn" onclick="pay(${x.p},${i})">${t.pay}</button></div>`});document.getElementById("prods").innerHTML=h}
function changeLang(){const l=document.getElementById("lang").value;const t=T[l];for(let k in t){if(document.getElementById(k))document.getElementById(k).innerText=t[k]}loadP()}
document.querySelectorAll('.item').forEach(i=>{i.onclick=function(){const p=this.dataset.p;document.querySelectorAll('.page').forEach(x=>x.classList.remove('active'));document.getElementById(p).classList.add('active');document.querySelectorAll('.item').forEach(x=>x.classList.remove('act'));this.classList.add('act');if(p=='m')loadP()}})

Pi.init({version:"2.0",sandbox:true});
document.getElementById("login").onclick=async()=>{const l=document.getElementById("lang").value;try{const a=await Pi.authenticate(['username','payments']);document.getElementById("st").innerText=T[l].con;document.getElementById("login").disabled=true;document.getElementById("pu").innerText="Status: "+a.user.username}catch(e){alert("Open in Pi Browser")}}

function pay(a,i){const l=document.getElementById("lang").value;const t=T[l];const x=P[i];if(!confirm(`${x.n}\nAmount: π ${a}\n\n${t.test}`))return;Pi.createPayment({amount:a,memo:"TEST:"+x.n},{
onReadyForServerApproval:id=>setTimeout(()=>Pi.approvePayment(id),500),
onReadyForServerCompletion:(id,tx)=>alert("✅ Success! Tx:"+tx),
onCancel:()=>alert("Cancelled"),
onError:e=>alert("Error:"+e)
})}

document.getElementById('ai').onclick=()=>{const b=document.getElementById('box');b.style.display=b.style.display=='flex'?'none':'flex';document.getElementById('amsg').innerHTML=`<div>${T[document.getElementById("lang").value].aw}</div>`}
document.getElementById('asend').onclick=()=>{const m=document.getElementById('ain').value;if(!m)return;document.getElementById('amsg').innerHTML+=`<div style="text-align:right;background:var(--g);padding:8px;border-radius:10px;margin:5px 0">${m}</div>`;setTimeout(()=>{document.getElementById('amsg').innerHTML+=`<div style="background:#eee;padding:8px;border-radius:10px;margin:5px 0">I help with SHALOM</div>`},500);document.getElementById('ain').value=""}
document.getElementById("out").onclick=()=>location.reload();
changeLang();
</script></body></html>
