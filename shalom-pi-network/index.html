<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SHALOM GLOBAL - GCV STORE</title>
<script src="https://sdk.minepi.com/pi-sdk.js"></script>
<style>
    * { box-sizing: border-box; }
  body { font-family: Arial, sans-serif; background: #F8F9FF; margin:0; color:#001F54; padding-bottom:80px; }
  .header { background: #001F54; color: white; padding: 15px; text-align:center; font-size:22px; font-weight:bold; position:sticky; top:0; z-index:10; }
  .slider { display:flex; overflow-x: auto; gap:10px; padding:10px; background: #FFD700; scroll-snap-type: x mandatory; }
  .slider img { width: 90%; height: 200px; border-radius: 12px; flex-shrink: 0; scroll-snap-align: start; object-fit: cover; }
  .products { display:grid; grid-template-columns: repeat(2,1fr); gap:12px; padding:12px; }
  .card { background:white; border-radius:12px; padding:10px; box-shadow: 0 2px 6px rgba(0,0,0,0.1); }
  .card img { width:100%; height:160px; object-fit:cover; border-radius:8px; }
  .card h4 { font-size:14px; margin:8px 0 4px 0; min-height:36px; }
  .price { color:#001F54; font-weight:bold; font-size:20px; margin:4px 0; }
  .btn { background:#FFD700; color:#001F54; border:none; padding:10px; width:100%; border-radius:8px; font-weight:bold; font-size:15px; cursor:pointer; }
  .btn:active { background:#E6C200; }
  .bottom-nav { position:fixed; bottom:0; left:0; width:100%; display:flex; background:#001F54; color:white; box-shadow:0 -2px 5px rgba(0,0,0,0.2); }
  .bottom-nav div { flex:1; text-align:center; padding:14px 5px; font-size:12px; font-weight:bold; }
  .note { text-align:center; padding:10px; font-size:12px; color:#555; }
</style>
</head>
<body>

<div class="header">SHALOM GLOBAL</div>

<div class="slider">
  <img src="https://via.placeholder.com/800x400/001F54/FFD700?text=LUXURY+VILLA+DUBAI" alt="Villa Dubai">
  <img src="https://via.placeholder.com/800x400/001F54/FFD700?text=BUGATTI+CHIRON" alt="Bugatti">
  <img src="https://via.placeholder.com/800x400/001F54/FFD700?text=MALDIVES+ISLAND" alt="Island">
</div>

<div class="note">All prices calculated using GCV: 1 π = $314,159</div>

<div class="products" id="products"></div>

<div class="bottom-nav">
  <div>Home</div>
  <div>Market</div>
  <div>Cars</div>
  <div>Assets</div>
  <div>Account</div>
</div>

<script>
// 12 GLOBAL PRODUCTS - PRICES IN PI ONLY
const products = [
  {name:"SHALOM VILLA DUBAI - BURJ VIEW", price:5.0, img:"https://via.placeholder.com/600x400/001F54/FFD700?text=VILLA+DUBAI"},
  {name:"BUGATTI CHIRON SUPER SPORT", price:10.0, img:"https://via.placeholder.com/600x400/001F54/FFD700?text=BUGATTI+CHIRON"},
  {name:"TESLA MODEL S PLAID", price:0.2, img:"https://via.placeholder.com/600x400/001F54/FFD700?text=TESLA+MODEL+S"},
  {name:"IPHONE 17 PRO MAX 1TB", price:0.005, img:"https://via.placeholder.com/600x400/001F54/FFD700?text=IPHONE+17+PRO"},
  {name:"ROLEX GMT MASTER II", price:0.1, img:"https://via.placeholder.com/600x400/001F54/FFD700?text=ROLEX+GMT"},
  {name:"MALDIVES PRIVATE ISLAND", price:50.0, img:"https://via.placeholder.com/600x400/001F54/FFD700?text=MALDIVES+ISLAND"},
  {name:"1KG GOLD BAR 24K", price:0.8, img:"https://via.placeholder.com/600x400/FFD700/001F54?text=1KG+GOLD"},
  {name:"PRIVATE JET - 1 HOUR FLIGHT", price:0.5, img:"https://via.placeholder.com/600x400/001F54/FFD700?text=PRIVATE+JET"},
  {name:"BURJ AL ARAB - 1 NIGHT SUITE", price:0.01, img:"https://via.placeholder.com/600x400/001F54/FFD700?text=BURJ+AL+ARAB"},
  {name:"TEXAS RANCH - 1000 ACRES", price:10.0, img:"https://via.placeholder.com/600x400/001F54/FFD700?text=TEXAS+RANCH"},
  {name:"HARVARD ONLINE DEGREE", price:0.2, img:"https://via.placeholder.com/600x400/001F54/FFD700?text=HARVARD+EDU"},
  {name:"LUXURY HEALTH CHECKUP VIP", price:0.5, img:"https://via.placeholder.com/600x400/001F54/FFD700?text=LUXURY+HEALTH"}
];

// LOAD PRODUCTS
function loadProducts() {
  let html = "";
  products.forEach(p => {
    html += `
    <div class="card">
      <img src="${p.img}" alt="${p.name}">
      <h4>${p.name}</h4>
      <p class="price">π ${p.price}</p>
      <button class="btn" onclick="payWithPi(${p.price}, '${p.name}')">Pay with Pi</button>
    </div>`;
  });
  document.getElementById("products").innerHTML = html;
}

// PI PAYMENT - TESTNET MODE
async function payWithPi(amount, productName) {
  try {
    Pi.init({ version: "2.0", sandbox: true }); // TRUE = TESTNET. Change to FALSE for Mainnet later
    
    const paymentData = {
      amount: amount,
      memo: productName,
      metadata: { product: productName, store: "SHALOM GLOBAL" }
    };
    
    const callbacks = {
      onReadyForServerApproval: function(paymentId) { 
        alert("Step 1: Payment Created. ID: " + paymentId + "\nNow waiting for approval..."); 
      },
      onReadyForServerCompletion: function(paymentId, txid) { 
        alert("SUCCESS! Payment Completed for: " + productName + "\nTxID: " + txid); 
      },
      onCancel: function(paymentId) { 
        alert("Payment Cancelled for: " + productName); 
      },
      onError: function(error) { 
        alert("Error: " + error); 
      }
    };
    Pi.createPayment(paymentData, callbacks);
    
  } catch(err) {
    alert("Please open this app inside Pi Browser to test payments.");
  }
}

loadProducts();
</script>
</body>
</html>
