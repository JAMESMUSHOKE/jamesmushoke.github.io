<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SHALOM - Global Pi Marketplace</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- HEADER -->
  <header>
    <div class="logo-area">
      <img src="https://i.imgur.com/XXXXXXX.png" alt="SHALOM Logo" class="logo">
      <div>
        <h1 data-lang="title">SHALOM</h1>
        <p data-lang="slogan">Shop The World. Pay With Pi.</p>
      </div>
    </div>
    <div class="header-right">
      <select id="lang-switcher">
        <option value="en">🌐 English</option>
        <option value="sw">Swahili</option>
        <option value="zh">中文</option>
        <option value="es">Español</option>
        <option value="id">Bahasa</option>
        <option value="vi">Tiếng Việt</option>
      </select>
      <button class="profile-btn">👤</button>
    </div>
  </header>

  <!-- SEARCH -->
  <div class="search-bar">
    <input type="text" data-lang="search" placeholder="Search for anything with Pi...">
  </div>

  <!-- BANNER -->
  <section class="banner">
    <h2 data-lang="banner_title">🌍 GLOBAL PI MARKETPLACE 🌍</h2>
    <p data-lang="banner_sub">Buy & Sell with Pi. No Banks. No Borders.</p>
    <div class="banner-btns">
      <button class="btn-primary" data-lang="btn_shop">Start Shopping</button>
      <button class="btn-secondary" data-lang="btn_sell">Become a Seller</button>
    </div>
  </section>

  <!-- CATEGORIES -->
  <section class="categories">
    <h3 data-lang="cat_title">Shop by Category</h3>
    <div class="cat-grid">
      <div class="cat-item">👗<span data-lang="cat1">Fashion</span></div>
      <div class="cat-item">📱<span data-lang="cat2">Electronics</span></div>
      <div class="cat-item">💻<span data-lang="cat3">Digital</span></div>
      <div class="cat-item">🛠️<span data-lang="cat4">Services</span></div>
      <div class="cat-item">₿<span data-lang="cat5">Crypto</span></div>
      <div class="cat-item">🏠<span data-lang="cat6">Home</span></div>
      <div class="cat-item">🎨<span data-lang="cat7">Art</span></div>
      <div class="cat-item">⋯<span data-lang="cat8">More</span></div>
    </div>
  </section>

  <!-- FEATURED -->
  <section class="featured">
    <h3 data-lang="featured">🔥 Trending with Pi</h3>
    <div class="empty-state">
      <p>📦</p>
      <h4 data-lang="empty_title">No products yet</h4>
      <p data-lang="empty_sub">Be the first seller!</p>
      <button class="btn-primary" data-lang="btn_list">List Your First Item - Free</button>
    </div>
  </section>

  <!-- BOTTOM MENU -->
  <nav class="bottom-menu">
    <a href="#" class="active">🏠<span data-lang="menu_home">Home</span></a>
    <a href="#">📦<span data-lang="menu_products">Products</span></a>
    <a href="#">➕<span data-lang="menu_sell">Sell</span></a>
    <a href="#">📋<span data-lang="menu_orders">Orders</span></a>
    <a href="#">👤<span data-lang="menu_profile">Profile</span></a>
  </nav>

  <script src="app.js"></script>
</body>
</html>
