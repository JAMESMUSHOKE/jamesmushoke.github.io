<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pioneer Market - Web3</title>
  <script src="https://sdk.minepi.com/pi-sdk.js"></script>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body { background: linear-gradient(135deg, #000 0%, #1a0033 100%); color:white; font-family:'Segoe UI', Arial; padding:15px; min-height:100vh; }
 .container { max-width:600px; margin:auto; }
 .topbar { display:flex; justify-content:space-between; align-items:center; margin-bottom:15px; }
 .badge { background:gold; color:#000; padding:10px; border-radius:10px; font-weight:bold; font-size:12px; }
    select { background:#222; color:gold; border:1px solid purple; padding:8px; border-radius:8px; font-weight:bold; }
    h1 { color:gold; text-align:center; margin-bottom:5px; font-size:26px; }
    #subtitle { text-align:center; margin-bottom:15px; color:#ccc; }
    #user-info { text-align:center; margin:10px 0; color:gold; background:#111; padding:10px; border-radius:8px; }
 .grid { display:grid; grid-template-columns:1fr; gap:15px; }
 .product { background:#111; padding:20px; border-radius:15px; border:2px solid purple; }
 .product h2 { color:gold; margin-bottom:8px; font-size:18px; }
 .price { font-size:16px; margin:8px 0; }
    button { background:linear-gradient(90deg, purple, #8000ff); color:white; border:0; padding:14px; border-radius:10px; width:100%; font-size:16px; font-weight:bold; cursor:pointer; }
    #addProductBtn { background:green; margin-top:20px; }
  </style>
</head>
<body>
  <div class="container">
    <div class="topbar">
      <div class="badge">🔶 TESTNET - GCV $314,159/π</div>
      <select id="langSelect" onchange="changeLanguage()">
        <option value="en">English</option>
        <option value="sw">Kiswahili</option>
      </select>
    </div>

    <h1 id="title">🛒 PIONEER MARKET</h1>
    <p id="subtitle">BUY AND SELL PRODUCTS WITH PI COIN</p>
    <p id="user-info">Connecting to Pi...</p>

    <div class="grid" id="productList"></div>
    
    <button id="addProductBtn" onclick="addProduct()">+ Add New Product</button>
  </div>

<script>
  const translations = {
    en: {
      title: "🛒 PIONEER MARKET",
      subtitle: "BUY AND SELL PRODUCTS WITH PI COIN",
      loading: "Connecting to Pi...",
      welcome: "✅ Welcome, @",
      buy: "BUY NOW",
      price: "Price: <b>",
      add: "+ Add New Product",
      success: "🎉 PAYMENT SUCCESS!\n\nProduct: ",
      cancel: "Payment cancelled",
      error: "Error: "
    },
    sw: {
      title: "🛒 SOKO LA PIONEER",
      subtitle: "SOKO LA KUNUNUA NA KUUZA BITHA KWA PI COIN",
      loading: "Inaunganishwa na Pi...",
      welcome: "✅ Karibu, @",
      buy: "NUNUA SASA",
      price: "Bei: <b>",
      add: "+ Ongeza Bidhaa Mpya",
      success: "🎉 MALIPO YAMEFAULI!\n\nBidhaa: ",
      cancel: "Umekataa malipo",
      error: "Hitilafu: "
    }
  };

  let currentLang = 'en'; // TUMEWEKA DEFAULT NI ENGLISH
  let products = [
    {name: "SmartWatch", price: 1.1},
    {name: "Wireless Earbuds", price: 1.1},
    {name: "Phone Charger", price: 0.5}
  ];

  function changeLanguage() {
    currentLang = document.getElementById('langSelect').value;
    renderProducts();
  }

  function renderProducts() {
    const t = translations[currentLang];
    document.getElementById('title').innerText = t.title;
    document.getElementById('subtitle').innerText = t.subtitle;
    document.getElementById('addProductBtn').innerText = t.add;
    
    let html = '';
    products.forEach((p) => {
      html += `
      <div class="product">
        <h2>${p.name}</h2>
        <p class="price">${t.price}${p.price} π Test</b></p>
        <p style="color:#aaa; font-size:12px;">≈ $${(p.price * 314159).toLocaleString()} GCV</p>
        <button onclick="makePayment('${p.name}', ${p.price})">${t.buy}</button>
      </div>`;
    });
    document.getElementById('productList').innerHTML = html;
  }

  function addProduct() {
    let name = prompt(currentLang=='sw'? "Jina la Bidhaa:" : "Product Name:");
    let price = parseFloat(prompt(currentLang=='sw'? "Bei kwa Pi:" : "Price in Pi:"));
    if(name && price) {
      products.push({name, price});
      renderProducts();
    }
  }

  const scopes = ['username', 'payments', 'wallet_address'];
  function onIncompletePaymentFound(payment) { 
    Pi.approvePayment(payment.identifier);
  }

  Pi.init({ version: "2.0", sandbox: "true", onIncompletePaymentFound });

  window.onload = function() {
    renderProducts();
    Pi.authenticate(scopes, onIncompletePaymentFound)
  .then(function(auth) {
        document.getElementById("user-info").innerText = translations[currentLang].welcome + auth.user.username;
      })
  .catch(function(error) {
        document.getElementById("user-info").innerText = "⚠️ Please Sign in with Pi";
      });
  };

  function makePayment(productName, amount){
    const t = translations[currentLang];
    Pi.createPayment({
      amount: amount,
      memo: "Pioneer Market - " + productName,
      metadata: { product: productName }
    }, {
      onReadyForServerApproval: (paymentId) => {
        Pi.approvePayment(paymentId);
        setTimeout(() => { Pi.completePayment(paymentId, "TX_" + Date.now()); }, 1000);
      },
      onReadyForServerCompletion: (paymentId, txid) => {
        alert(t.success + productName + "\nAmount: " + amount + " π Test" + "\nTxID: " + txid + "\n\nTAKE SCREENSHOT FOR CHECKLIST 10!");
      },
      onCancel: () => { alert(t.cancel); },
      onError: (error) => { alert(t.error + error); }
    });
  }
</script>
</body>
</html>
