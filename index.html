<!DOCTYPE html>
<html>
<head>
  <title>SHALOM ITEM 10 FIX</title>
  <script src="https://sdk.minepi.com/pi-sdk.js"></script>
  <style>
    body{background:#000;color:#fff;text-align:center;padding:30px;font-family:Arial}
    .box{background:#111;border:2px solid orange;padding:20px;border-radius:15px;margin-top:20px}
    button{padding:20px 30px;background:orange;color:#000;border:none;border-radius:10px;font-size:18px;font-weight:bold;width:90%;margin:10px}
    #status{margin-top:20px;padding:15px;background:#222;border-radius:8px}
  </style>
</head>
<body>
  <h1>SHALOM ITEM 10</h1>
  <div class="box">
    <p>Welcome: <b id="u">Guest</b></p>
    <button id="btn">START TEST PAYMENT</button>
    <div id="status">Click button to start</div>
  </div>

<script>
Pi.init({version:"2.0",sandbox:true});

Pi.authenticate(['username','payments']).then(a=>{
  document.getElementById("u").innerText = a.user.username;
});

document.getElementById("btn").onclick = () => {
  document.getElementById("status").innerText = "Creating payment...";
  
  Pi.createPayment({
    amount: 0.01,
    memo: "Test",
    metadata: {}
  },{
    onReadyForServerApproval: (paymentId) => {
      document.getElementById("status").innerText = "Auto Approving...";
      // HII NDIO FIX: Approve mara moja bila delay
      Pi.approvePayment(paymentId);
    },
    onReadyForServerCompletion: (paymentId, txid) => {
      Pi.completePayment(paymentId, txid);
      document.getElementById("status").innerHTML = "SUCCESS! ✅<br>TX: "+txid;
      alert("IMEFIKA! Nenda Checklist sasa");
    },
    onCancel: () => { document.getElementById("status").innerText = "Cancelled"; },
    onError: (e) => { document.getElementById("status").innerText = "Error: " + e; }
  });
}
</script>
</body>
</html>
