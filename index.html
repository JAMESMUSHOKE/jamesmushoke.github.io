<!DOCTYPE html>
<html>
<head>
  <title>Shalom Dev</title>
  <script src="https://sdk.minepi.com/pi-sdk.js"></script>
  <style>body { font-family: Arial; text-align: center; padding: 20px; } #loader { font-size: 18px; color: #6f42c1; } #main-content { display: none; } #admin-panel { display:none; border:2px solid red; padding:15px; margin-top:20px; text-align:left; }</style>
</head>
<body>
<div id="loader">Loading Shalom App...</div>
<div id="main-content">
  <h1>Welcome to SHALOM</h1>
  <p>Web3 Payments for the World</p>
  <button id="pi-login">Authenticate with Pi</button>
  <button id="buy-btn" onclick="buyProduct('Shalom Product', 1)">Pay with Pi</button>
  <div id="admin-panel"><h3>ADMIN PANEL</h3><p>Owner Access Only</p></div>
</div>
<script>
let currentUser = null;
Pi.init({ version: "2.0", sandbox: true });
window.addEventListener('load', async () => {
  setTimeout(async () => {
    try {
      const authResult = await Pi.authenticate(['username', 'payments'], onIncompletePaymentFound);
      currentUser = authResult.user;
      document.getElementById("loader").style.display = "none";
      document.getElementById("main-content").style.display = "block";
      document.getElementById("pi-login").innerText = `Welcome Admin: ${currentUser.username}`;
      document.getElementById("pi-login").disabled = true;
      document.getElementById("admin-panel").style.display = "block";
      alert(`Welcome back, ${currentUser.username}!`);
    } catch (err) { 
      document.getElementById("loader").innerText = "Login Failed. Please Refresh";
      console.error(err); 
    }
  }, 1500);
});
function onIncompletePaymentFound(payment) { console.log(payment); }
async function buyProduct(productName, amount) {
  if(!currentUser) return alert("Please wait...");
  alert("Processing Payment with Pi...");
  setTimeout(() => { alert(`Payment Success! \nProduct: ${productName}\nTX: SIM-TX-${Date.now()}`); }, 2000);
}
</script>
</body>
</html>
