<!DOCTYPE html>
<html lang="sw">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Soko La Pioneer</title>
    <script src="https://sdk.minepi.com/pi-sdk.js"></script>
    <style>
        body { background:#111; color:white; font-family:Arial; text-align:center; padding:20px; }
        .product { background:#222; margin:15px; padding:15px; border-radius:10px; }
        button { background:purple; color:white; border:none; padding:10px 20px; border-radius:8px; }
        #history { margin-top:20px; text-align:left; }
    </style>
</head>
<body>
    <h1>🛒 SOKO LA PIONEER</h1>
    <button onclick="login()">Ingia na Pi</button>
    <div id="user"></div>

    <div class="product">
        <h3>SmartWatch</h3>
        <p>Bei: 1.1 π</p>
        <button onclick="buy('SmartWatch', 1.1)">Nunua</button>
    </div>

    <div class="product">
        <h3>Earbuds Bila Waya</h3>
        <p>Bei: 1.1 π</p>
        <button onclick="buy('Earbuds Bila Waya', 1.1)">Nunua</button>
    </div>

    <div id="history">
        <h3>Historia ya Oda</h3>
        <ul id="no-history"><li>Hakuna oda bado</li></ul>
    </div>

<script>
Pi.init({ version: "2.0" });
function login(){
    Pi.authenticate(['username'], function(auth){ 
        document.getElementById('user').innerText = "Karibu: " + auth.user.username;
    }, function(err){ alert("Login imeshindikana") });
}
function buy(item, price){
    alert("✅ Oda Imewekwa! \nBidhaa: " + item + "\nBei: " + price + " π");
}
</script>
</body>
</html>
