<!DOCTYPE html>
<html>
<head>
  <title>SHALOM DEV</title>
  <script src="https://sdk.minepi.com/pi-sdk.js"></script>
</head>
<body>
<h1>SHALOM DEV MODE</h1>
<button onclick="pay()">Test Pay 0.01</button>
<script>
Pi.init({ version: "2.0", sandbox: true }); // TEST MODE
function pay(){
  Pi.createPayment({
    amount: 0.01, memo: "Test", metadata: {}
  }, {
    onReadyForServerApproval: (id) => Pi.approvePayment(id),
    onReadyForServerCompletion: (id, txid) => Pi.completePayment(id, txid)
  });
}
</script>
</body>
</html>
