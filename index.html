<!DOCTYPE html>
<html lang="sw">
<head>
<meta charset="UTF-8">
<title>Soko La Pioneer</title>
<script src="https://sdk.minepi.com/pi-sdk.js"></script>
<style>
body{background:#000;color:white;text-align:center;font-family:Arial;padding:20px}
.badge{background:gold;color:#000;padding:10px;border-radius:8px;font-weight:bold}
.product{background:#1a1a1a;margin:20px auto;padding:20px;border-radius:15px;max-width:400px;border:1px solid purple}
button{background:purple;color:white;border:0;padding:15px 30px;border-radius:10px;font-size:18px;cursor:pointer}
button:active{background:#8a2be2}
</style>
</head>
<body>
<div class="badge">TESTNET MODE - GCV $314,159/π</div>
<h1>🛒 SOKO LA PIONEER</h1>

<div class="product">
<h2>SmartWatch</h2>
<p>Bei: 1.1 π Test</p>
<p>≈ $345,574.90</p>
<button onclick="buy('SmartWatch',1.1)">NUNUA SASA</button>
</div>

<div class="product">
<h2>Wireless Earbuds</h2>
<p>Bei: 1.1 π Test</p>
<p>≈ $345,574.90</p>
<button onclick="buy('Earbuds',1.1)">NUNUA SASA</button>
</div>

<script>
Pi.init({version:"2.0", sandbox:"true"});

function buy(item,price){
  alert("Tunaomba malipo ya Test Pi...");
  Pi.createPayment({
    amount:price,
    memo:"Soko La Pioneer - "+item,
    metadata:{product:item}
  },{
    onReadyForServerApproval:function(paymentId){
      // HII NDIO INASOLVE "EXPIRED"
      Pi.approvePayment(paymentId);
      setTimeout(()=>Pi.completePayment(paymentId,"TEST_"+Date.now()),1500);
    },
    onReadyForServerCompletion:function(paymentId,txid){
      alert("🎉 HONGELA Mkuu!\nMalipo Yamekamilika!\nBidhaa: "+item+"\nTxID: "+txid+"\n\nPIGA SCREENSHOT HII!");
    },
    onCancel:function(){alert("Umekataa")},
    onError:function(e){alert("Kosa: "+e)}
  });
}
</script>
</body>
</html>
