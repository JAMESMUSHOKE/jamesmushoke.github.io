<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SHALOM - Item 10 Test</title>
  <script src="https://sdk.minepi.com/pi-sdk.js"></script>
  <style>
    body{background:#0a0a0a;color:#fff;text-align:center;padding:20px;font-family:Arial}
    .container{max-width:420px;margin:30px auto}
    .box{background:#1a1a1a;border:2px solid #f39c12;padding:25px;border-radius:15px}
    h1{color:#f39c12}
    button{padding:20px;background:#f39c12;color:#000;border:none;border-radius:12px;font-size:18px;font-weight:bold;width:100%;cursor:pointer;margin-top:15px}
    button:hover{background:#e67e22}
    #status{margin-top:15px;padding:12px;background:#222;border-radius:8px;min-height:25px;font-size:14px}
    .logo{width:80px;margin-bottom:15px}
  </style>
</head>
<body>
  <div class="container">
    <img src="logo.png" class="logo">
    <h1>SHALOM PAYMENT TEST</h1>
    <p>For Developer Portal Checklist Item 10</p>
    
    <div class="box">
      <p>Welcome: <b id="username">Guest</b></p>
      <button id="payBtn">TEST PAY 0.01 Pi</button>
      <div id="status">Status: Ready</div>
    </div>
    
    <p style="font-size:12px;color:#aaa;margin-top:20px">
      Note: This uses Testnet Pi. No real Pi will be deducted.
    </p>
  </div>

<script>
// STEP 1: Initialize Pi SDK for Testnet
Pi.init({ 
  version: "2.0", 
  sandbox: true  // MUHIMU SANA: true for Item 10
});

// STEP 2: Authenticate on load
Pi.authenticate(['username', 'payments'])
  .then(function(auth) {
    document.getElementById("username").innerText = auth.user.username;
  })
  .catch(function(error) {
    document.getElementById("status").innerText = "Auth Error: " + error;
  });

// STEP 3: Create Payment when button is clicked
document.getElementById("payBtn").onclick = function() {
  document.getElementById("status").innerText = "Opening Pi Wallet...";
  
  const paymentData = {
    amount: 0.01, // Must be > 0.001
    memo: "SHALOM Item 10 Test Payment",
    metadata: { 
      app: "SHALOM",
      purpose: "checklist_item_10",
      timestamp: new Date().toISOString()
    } // Metadata MUST NOT be empty
  };

  const callbacks = {
    onReadyForServerApproval: function(paymentId) {
      document.getElementById("status").innerText = "Approved. Completing...";
      // For Testnet we approve directly
      Pi.approvePayment(paymentId);
    },
    onReadyForServerCompletion: function(paymentId, txid) {
      document.getElementById("status").innerHTML = 
        "✅ SUCCESS!<br>TXID: " + txid + 
        "<br><br>Go to Developer Portal and Complete Item 10";
      Pi.completePayment(paymentId, txid);
      alert("CONGRATULATIONS! Item 10 Payment Successful!");
    },
    onCancel: function(paymentId) {
      document.getElementById("status").innerText = "Payment Cancelled by User";
    },
    onError: function(error) {
      document.getElementById("status").innerText = "Error: " + error;
      console.error(error);
    }
  };

  Pi.createPayment(paymentData, callbacks);
};
</script>
</body>
</html>
