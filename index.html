<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SHALOM - Item 10 FINAL</title>
  <script src="https://sdk.minepi.com/pi-sdk.js"></script>
  <style>
    body{background:#000;color:#fff;text-align:center;padding:20px;font-family:Arial}
    .container{max-width:400px;margin:20px auto}
    .box{background:#111;border:3px solid #f39c12;padding:20px;border-radius:15px}
    h1{color:#f39c12;font-size:22px}
    button{padding:18px;background:#f39c12;color:#000;border:none;border-radius:10px;font-size:17px;font-weight:bold;width:100%;cursor:pointer;margin-top:12px}
    button:disabled{background:#444}
    #status{margin-top:15px;padding:10px;background:#222;border-radius:8px;font-size:13px;min-height:40px}
  </style>
</head>
<body>
  <div class="container">
    <h1>SHALOM ITEM 10</h1>
    <div class="box">
      <p>User: <b id="username">Not Logged In</b></p>
      <button id="login">LOGIN</button>
      <button id="pay" disabled>PAY 0.01 TEST PI</button>
      <div id="status">1. Login First</div>
    </div>
  </div>

<script>
let myPaymentId = null;

Pi.init({ version: "2.0", sandbox: true }); // LAZIMA TRUE

document.getElementById("login").onclick = async () => {
  document.getElementById("status").innerText = "Logging in...";
  try {
    const auth = await Pi.authenticate(['username', 'payments']);
    document.getElementById("username").innerText = auth.user.username;
    document.getElementById("login").innerText = "LOGGED IN ✓";
    document.getElementById("login").disabled = true;
    document.getElementById("pay").disabled = false;
    document.getElementById("status").innerText = "2. Now Click PAY";
  } catch(e) {
    document.getElementById("status").innerText = "Error: Open in Pi Browser Only!";
  }
};

document.getElementById("pay").onclick = () => {
  document.getElementById("status").innerText = "Opening Wallet...";
  document.getElementById("pay").disabled = true;

  const paymentData = {
    amount: 0.01,
    memo: `SHALOM-TEST-${Date.now()}`, // Unique
    metadata: {paymentId: `SHALOM-${Date.now()}`}
  };

  Pi.createPayment(paymentData, {
    onReadyForServerApproval: (paymentId) => {
      myPaymentId = paymentId;
      document.getElementById("status").innerText = "Wallet Opened! Approving now...";
      // SIRI KUBWA: Lazima tumwambie Pi tumepokea
      Pi.approvePayment(paymentId); 
    },
    onReadyForServerCompletion: (paymentId, txid) => {
      document.getElementById("status").innerHTML = `✅ SUCCESS!<br>TX: ${txid}<br>Go Complete Item 10!`;
      Pi.completePayment(paymentId, txid);
      alert("CONGRATS! Screenshot this and go to Developer Portal > Item 10 > COMPLETE");
    },
    onCancel: (paymentId) => {
      document.getElementById("status").innerText = "Cancelled. Refresh page and try again.";
      document.getElementById("pay").disabled = false;
    },
    onError: (error) => {
      document.getElementById("status").innerText = "Error: " + JSON.stringify(error);
      document.getElementById("pay").disabled = false;
    }
  });
};
</script>
</body>
</html>
