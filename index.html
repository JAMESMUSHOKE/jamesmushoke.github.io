<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pioneer Market - Web3 E-commerce</title>
  <script src="https://sdk.minepi.com/pi-sdk.js"></script>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body { background: linear-gradient(135deg, #000 0%, #1a0033 100%); color:white; font-family:'Segoe UI', Arial; padding:20px; min-height:100vh; }
   .container { max-width:500px; margin:auto; }
   .topbar { display:flex; justify-content:space-between; align-items:center; margin-bottom:20px; }
   .badge { background:gold; color:#000; padding:10px; border-radius:10px; font-weight:bold; font-size:12px; }
    select { background:#222; color:gold; border:1px solid purple; padding:8px; border-radius:8px; font-weight:bold; }
    h1 { color:gold; text-align:center; margin-bottom:10px; }
    #user-info { text-align:center; margin:15px 0; color:gold; background:#111; padding:10px; border-radius:8px; }
   .product { background:#111; padding:20px; border-radius:15px; border:2px solid purple; margin-bottom:15px; }
   .product h2 { color:gold; margin-bottom:10px; }
   .price { font-size:18px; margin:10px 0; }
    button { background:linear-gradient(90deg, purple, #8000ff); color:white; border:0; padding:15px; border-radius:10px; width:100%; font-size:16px; font-weight:bold; cursor:pointer; }
    button:disabled { background:gray; cursor:not-allowed; }
  </style>
</head>
<body>
  <div class="container">
    <div class="topbar">
      <div class="badge">🔶 TESTNET - GCV $314,159/π</div>
      <select id="langSelect" onchange="changeLanguage()">
        <option value="en">English</option>
        <option value="sw">Kiswahili</option>
      </select>
    </div>

    <h1 id="title">🛒 PIONEER MARKET</h1>
    <p id="subtitle" style="text-align:center;">The First Web3 Marketplace in Tanzania for Pi Coin</p>
    <p id="user-info">Loading...</p>

    <div class="product">
      <h2 id="p1_name">⌚ SmartWatch</h2>
      <p class="price"><span id="p1_price">Price: <b>1.1 π Test</b></span></p>
      <p style="color:#aaa; font-size:14px;">≈ $345,574.90 GCV</p>
      <button id="p1_btn" onclick="makePayment('SmartWatch', 1.1)">BUY NOW</button>
    </div>
    
    <div class="product">
      <h2 id="p2_name">🎧 Wireless Earbuds</h2>
      <p class="price"><span id="p2_price">Price: <b>1.1 π Test</b></span></p>
      <p style="color:#aaa; font-size:14px;">≈ $345,574.90 GCV</p>
      <button id="p2_btn" onclick="makePayment('Wireless Earbuds', 1.1)">BUY NOW</button>
    </div>
  </div>

<script>
  // LUGHA ZA KIMATAIFA
  const translations = {
    en: {
      title: "🛒 PIONEER MARKET",
      subtitle: "The First Web3 Marketplace in Tanzania for Pi Coin",
      loading: "Connecting to Pi...",
      welcome: "✅ Welcome, @",
      buy: "BUY NOW",
      price: "Price: <b>",
      success: "🎉 CONGRATULATIONS!\n\nPayment Successful!\n\nProduct: ",
      cancel: "Payment cancelled",
      error: "Error: "
    },
    sw: {
      title: "🛒 SOKO LA PIONEER",
      subtitle: "Soko la Kwanza la Web3 Tanzania kwa Pi Coin",
      loading: "Inaunganishwa na Pi...",
      welcome: "✅ Karibu, @",
      buy: "NUNUA SASA",
      price: "Bei: <b>",
      success: "🎉 HONGELA MKUU!\n\nMalipo Yamekamilika!\n\nBidhaa: ",
      cancel: "Umekataa malipo",
      error: "Hitilafu: "
    }
  };

  let currentLang = 'en';

  function changeLanguage() {
    currentLang = document.getElementById('langSelect').value;
    const t = translations[currentLang];
    document.getElementById('title').innerText = t.title;
    document.getElementById('subtitle').innerText = t.subtitle;
    document.getElementById('p1_btn').innerText = t.buy;
    document.getElementById('p2_btn').innerText = t.buy;
    document.getElementById('p1_price').innerHTML = t.price + "1.1 π Test</b>";
    document.getElementById('p2_price').innerHTML = t.price + "1.1 π Test</b>";
  }

  // PI SDK WEB3
  const scopes = ['username', 'payments', 'wallet_address'];
  function onIncompletePaymentFound(payment) { Pi.approvePayment(payment.identifier); }

  Pi.init({ version: "2.0", sandbox: "true", onIncompletePaymentFound });

  window.onload = function() {
    document.getElementById("user-info").innerText = translations[currentLang].loading;
    Pi.authenticate(scopes, onIncompletePaymentFound)
     .then(function(auth) {
        document.getElementById("user-info").innerText = translations[currentLang].welcome + auth.user.username;
      })
     .catch(function(error) {
        document.getElementById("user-info").innerText = "⚠️ Please Sign in with Pi";
      });
  };

  function makePayment(productName, amount){
    const t = translations[currentLang];
    Pi.createPayment({
      amount: amount,
      memo: "Pioneer Market - " + productName,
      metadata: { product: productName, app: "Pioneer Market" }
    }, {
      onReadyForServerApproval: (paymentId) => {
        Pi.approvePayment(paymentId);
        setTimeout(() => { Pi.completePayment(paymentId, "TX_TEST_" + Date.now()); }, 2000);
      },
      onReadyForServerCompletion: (paymentId, txid) => {
        alert(t.success + productName + "\nAmount: " + amount + " π Test" + "\nTxID: " + txid + "\n\nTAKE SCREENSHOT FOR CHECKLIST 10!");
      },
      onCancel: () => { alert(t.cancel); },
      onError: (error) => { alert(t.error + error); }
    });
  }
</script>
</body>
</html>
