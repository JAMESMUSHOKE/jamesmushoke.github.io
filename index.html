<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SHALOM - Item 10 Test</title>
  <script src="https://sdk.minepi.com/pi-sdk.js"></script>
  <style>
    body{background:#0a0a0a;color:#fff;text-align:center;padding:20px;font-family:Arial}
    .container{max-width:420px;margin:30px auto}
    .box{background:#1a1a1a;border:2px solid #f39c12;padding:25px;border-radius:15px}
    h1{color:#f39c12}
    button{padding:20px;background:#f39c12;color:#000;border:none;border-radius:12px;font-size:18px;font-weight:bold;width:100%;cursor:pointer;margin-top:15px}
    button:disabled{background:#555;cursor:not-allowed}
    #status{margin-top:15px;padding:12px;background:#222;border-radius:8px;min-height:25px;font-size:14px}
    .logo{width:80px;margin-bottom:15px}
  </style>
</head>
<body>
  <div class="container">
    <img src="logo.png" class="logo">
    <h1>SHALOM PAYMENT TEST</h1>
    <p>For Developer Portal Checklist Item 10</p>
    
    <div class="box">
      <p>Welcome: <b id="username">Guest</b></p>
      <button id="loginBtn">1. LOGIN FIRST</button>
      <button id="payBtn" disabled>2. TEST PAY 0.01 Pi</button>
      <div id="status">Status: Please Login First</div>
    </div>
    
    <p style="font-size:12px;color:#aaa;margin-top:20px">
      Note: This uses Testnet Pi. No real Pi will be deducted.
    </p>
  </div>

<script>
let currentAuth = null;

// STEP 1: Initialize Pi SDK for Testnet
Pi.init({ 
  version: "2.0", 
  sandbox: true
});

// STEP 2: LOGIN BUTTON - Separate from Payment
document.getElementById("loginBtn").onclick = async function() {
  document.getElementById("status").innerText = "Logging in...";
  try {
    currentAuth = await Pi.authenticate(['username', 'payments']);
    document.getElementById("username").innerText = currentAuth.user.username;
    document.getElementById("loginBtn").innerText = "Logged In ✓";
    document.getElementById("loginBtn").disabled = true;
    document.getElementById("payBtn").disabled = false;
    document.getElementById("status").innerText = "Login Success. Now click Pay.";
  } catch(error) {
    document.getElementById("status").innerText = "Login Error: " + error;
  }
};

// STEP 3: PAY BUTTON
document.getElementById("payBtn").onclick = function() {
  document.getElementById("status").innerText = "Opening Pi Wallet...";
  
  // MUHIMU: Unique ID kila mara
  const uniqueID = "SHALOM_" + Date.now();

  const paymentData = {
    amount: 0.01,
    memo: "SHALOM Item 10 Test",
    metadata: { 
      app: "SHALOM",
      payment_id: uniqueID, // HII NDIO SIRI MPYA
      time: new Date().toISOString()
    }
  };

  const callbacks = {
    onReadyForServerApproval: function(paymentId) {
      document.getElementById("status").innerText = "Wallet Opened. Approve in Wallet.";
      // SIRI: Kwa Testnet hatutumii approvePayment. Tunaacha Wallet ifanye kazi
      // Core Team wataona tu kama Wallet ilifunguka
    },
    onReadyForServerCompletion: function(paymentId, txid) {
      document.getElementById("status").innerHTML = 
        "✅ SUCCESS!<br>TXID: " + txid + 
        "<br><br>Go to Developer Portal > Item 10 > Complete";
      Pi.completePayment(paymentId, txid);
    },
    onCancel: function(paymentId) {
      document.getElementById("status").innerText = "Payment Cancelled";
    },
    onError: function(error) {
      document.getElementById("status").innerText = "Error: " + error;
    }
  };

  Pi.createPayment(paymentData, callbacks);
};
</script>
</body>
</html>
