<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shalom Pi Network - Payment Test</title>
  <script src="https://sdk.minepi.com/pi-sdk.js"></script>
</head>
<body style="text-align: center; font-family: Arial; padding-top: 50px;">
  <h1>Shalom Pi Network</h1>
  <p>Click below to test Pi Payment on Testnet</p>
  
  <button id="payButton" style="padding: 20px 40px; font-size: 20px; background: #ffc107; border: none; border-radius: 10px; cursor: pointer;">
    PAY 0.01 TEST PI
  </button>

  <script>
    // Initialize Pi SDK for Testnet
    Pi.init({ version: "2.0", sandbox: true });

    document.getElementById("payButton").onclick = function() {
      const paymentData = {
        amount: 0.01,
        memo: "Test Payment for Shalom App",
        metadata: { "type": "test_payment" }
      };

      const callbacks = {
        onReadyForServerApproval: function(paymentId) {
          alert("Step 1 Approved! Payment ID: " + paymentId);
          // Wallet will open here to ask for passphrase
        },
        onReadyForServerCompletion: function(paymentId, txid) {
          alert("Payment Completed Successfully! Transaction ID: " + txid);
        },
        onCancel: function(paymentId) {
          alert("Payment Cancelled");
        },
        onError: function(error) {
          alert("Error: " + error);
        }
      };
      
      Pi.createPayment(paymentData, callbacks);
    };
  </script>
</body>
</html>
