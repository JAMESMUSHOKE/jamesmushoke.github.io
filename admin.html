<!DOCTYPE html>
<html><head><title>SHALOM ADMIN</title><style>
body{background:#000;color:#fff;font-family:Arial;padding:20px}
.box{background:#111;border:2px solid #00ff88;padding:15px;margin:10px 0;border-radius:10px}
.btn{background:#00ff88;color:#000;padding:10px;border:none;border-radius:8px;cursor:pointer;margin:5px}
</style></head><body>
<h1>⚙️ SHALOM ADMIN DASHBOARD</h1>
<div id="payments">Loading payments...</div>

<script>
async function loadPayments(){
  const res = await fetch('/api/payments/all');
  const payments = await res.json();
  let html = '';
  payments.forEach(p=>{
    html += `<div class="box">
      <b>Payment ID:</b> ${p.paymentId}<br>
      <b>Buyer:</b> ${p.buyer}<br>
      <b>Status:</b> ${p.status}<br>
      <b>Amount:</b> ${p.amount} Pi<br>
      ${p.status==='in_escrow'? `<button class="btn" onclick="release('${p.paymentId}')">RELEASE TO SELLER</button><button class="btn" onclick="refund('${p.paymentId}')">REFUND BUYER</button>` : 'Completed'}
    </div>`
  });
  document.getElementById('payments').innerHTML = html;
}
async function release(id){ await fetch('/api/payments/release',{method:'POST',body:JSON.stringify({paymentId:id})}); loadPayments();}
async function refund(id){ await fetch('/api/payments/refund',{method:'POST',body:JSON.stringify({paymentId:id})}); loadPayments();}
loadPayments();
</script>
</body></html>
